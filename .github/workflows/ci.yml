name: Verify NeoLingo
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
